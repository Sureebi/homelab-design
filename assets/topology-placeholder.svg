<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Homelab topology placeholder</title>
  <desc id="desc">A public-safe placeholder diagram showing that real topology data is pending.</desc>
  <rect width="1200" height="720" fill="#0f172a"/>
  <rect x="90" y="82" width="1020" height="556" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="600" y="180" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Homelab Network Topology</text>
  <text x="600" y="230" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Final diagram pending sanitized device outputs</text>
  <g fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 300v58"/>
    <path d="M410 430h380"/>
    <path d="M410 430v70"/>
    <path d="M600 430v70"/>
    <path d="M790 430v70"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="505" y="270" width="190" height="74" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="600" y="315" fill="#e0f2fe" font-size="22" font-weight="700">Internet</text>
    <rect x="480" y="360" width="240" height="86" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="600" y="410" fill="#e0f2fe" font-size="22" font-weight="700">Router / Firewall</text>
    <rect x="300" y="502" width="220" height="86" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="410" y="540" fill="#e0f2fe" font-size="21" font-weight="700">LAN / Wi-Fi</text>
    <text x="410" y="568" fill="#94a3b8" font-size="16">pending confirmation</text>
    <rect x="490" y="502" width="220" height="86" rx="12" fill="#1e293b" stroke="#38bdf8"/>
    <text x="600" y="540" fill="#e0f2fe" font-size="21" font-weight="700">Homelab Hosts</text>
    <text x="600" y="568" fill="#94a3b8" font-size="16">pending confirmation</text>
