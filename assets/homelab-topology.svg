<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Simple homelab network map</title>
  <desc id="desc">A simple public homelab route map from internet to router, home LAN, homelab hosts, Wi-Fi devices, and local services.</desc>
  <rect width="1200" height="820" fill="#0d1117"/>
  <style>
    .title{font:700 34px Segoe UI,Arial,sans-serif;fill:#f0f6fc}
    .note{font:400 16px Segoe UI,Arial,sans-serif;fill:#8b949e}
    .box{fill:#161b22;stroke:#30363d;stroke-width:2}
    .main{fill:#10233f;stroke:#58a6ff;stroke-width:2}
    .host{fill:#13251a;stroke:#3fb950;stroke-width:2}
    .svc{fill:#2b2111;stroke:#d29922;stroke-width:2}
    .wifi{fill:#231528;stroke:#bc8cff;stroke-width:2}
    .txt{font:700 18px Segoe UI,Arial,sans-serif;fill:#f0f6fc}
    .sub{font:400 14px Segoe UI,Arial,sans-serif;fill:#c9d1d9}
    .line{stroke:#8b949e;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .accent{stroke:#58a6ff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <text class="title" x="60" y="62">Homelab Network Map</text>
  <text class="note" x="60" y="92">Simple public topology, without IPs, ports, MAC addresses, or private config.</text>

  <rect class="main" x="470" y="126" width="260" height="74" rx="8"/>
  <text class="txt" x="600" y="158" text-anchor="middle">Internet</text>
  <text class="sub" x="600" y="181" text-anchor="middle">WAN boundary</text>

  <path class="accent" d="M600 200v58"/>

  <rect class="main" x="450" y="258" width="300" height="92" rx="8"/>
  <text class="txt" x="600" y="294" text-anchor="middle">MikroTik hAP ax3</text>
  <text class="sub" x="600" y="320" text-anchor="middle">Router / Firewall / Wi-Fi</text>

  <path class="line" d="M600 350v58"/>
  <path class="line" d="M252 408h696"/>
  <path class="line" d="M252 408v54"/>
  <path class="line" d="M600 408v54"/>
  <path class="line" d="M948 408v54"/>

  <rect class="box" x="112" y="462" width="280" height="90" rx="8"/>
  <text class="txt" x="252" y="498" text-anchor="middle">Home LAN</text>
  <text class="sub" x="252" y="524" text-anchor="middle">trusted local devices</text>

  <rect class="host" x="460" y="462" width="280" height="90" rx="8"/>
  <text class="txt" x="600" y="498" text-anchor="middle">Homelab</text>
  <text class="sub" x="600" y="524" text-anchor="middle">servers and services</text>

  <rect class="wifi" x="808" y="462" width="280" height="90" rx="8"/>
  <text class="txt" x="948" y="498" text-anchor="middle">Wi-Fi</text>
  <text class="sub" x="948" y="524" text-anchor="middle">phones, MacBook, IoT</text>

  <path class="line" d="M600 552v46"/>
  <path class="line" d="M424 598h352"/>
  <path class="line" d="M424 598v40"/>
  <path class="line" d="M776 598v40"/>

  <rect class="host" x="284" y="638" width="280" height="84" rx="8"/>
  <text class="txt" x="424" y="672" text-anchor="middle">Raspberry Pi 5</text>
  <text class="sub" x="424" y="698" text-anchor="middle">Docker / Dashboard / Portainer</text>

  <rect class="host" x="636" y="638" width="280" height="84" rx="8"/>
  <text class="txt" x="776" y="672" text-anchor="middle">Dell 7060 Micro</text>
  <text class="sub" x="776" y="698" text-anchor="middle">Proxmox / VMs</text>

  <path class="line" d="M424 722v34"/>
  <path class="line" d="M776 722v34"/>
  <path class="line" d="M424 756h352"/>

  <rect class="svc" x="300" y="756" width="600" height="48" rx="8"/>
  <text class="sub" x="600" y="785" text-anchor="middle">Local services: Immich, NPM, Monitoring, Minecraft, Admin tools</text>
</svg>
